# .github/workflows/verify.yml
# Last updated: 2026-09-19
#
# BRANCH PROTECTION NOTE:
# For the deep-verify gate to actually block merges, add "deep-verify" as a
# Required status check in branch protection settings for your default branch
# (Settings > Branches > branch protection rule > "Require status checks to pass
# before merging"). Without this, the job runs but GitHub will still allow merge
# if it fails or is skipped.
#
# "Quick Verify (all PRs)" is the real PR gate: it runs npm ci, the ledger
# check, the duplicate-decision-id check, typecheck (app and mcp/), lint, the
# unit suite, the production build, and the deep-verify self-test -- all
# against the PR's own code (2026-09-19). Before this, the job ran only the
# ledger check, the deep-verify self-test, and a curl against the LIVE
# deployed site, so it was structurally incapable of failing because of a
# PR's changes; a PR that broke the build or reddened every test merged
# green. Fourth and last of four repos ported to this dialect, after
# demo-harborbistro (PR #42), demo-slatewell (PR #43) and demo-axlepoint
# (PR #34). See docs/demos/lumen/decisions.md D-011.
#
# mcp/ is now typechecked in this job (previously excluded: npm ci 401'd on
# the private @paradigm-codes/* scope with no token available in Actions).
# That reason is gone -- PACKAGES_TOKEN now exists as a repo secret -- so
# `npm run mcp:typecheck` (part of this repo's own `npm run verify` battery)
# runs here too.
#
# No db:generate/seed step before build: proved by deleting the (gitignored)
# data/ directory and running `npm run build` from a clean worktree. It
# succeeded -- every /app and /api route is dynamic (server-rendered on
# demand); the only two static routes (/_not-found, /app/settings) never
# import src/lib/db.ts. Same finding, same reasoning as demo-slatewell's and
# demo-axlepoint's decisions.md entries for this. lumen-analytics's own
# Dockerfile does run `npm run seed:full && npm run build` in that order,
# but that order exists to ship the generated dataset inside the runtime
# image (COPY --from=build /app/data ./data), not because the build step
# reads it.
#
# "Live smoke (deployed site)" is NOT a gate on this PR. It curls
# verify/smoke.yml's deploy_url, i.e. whatever is already running in
# production, and says nothing about the code in this PR or this branch.
# Never make it a required status check on that basis; if a real
# preview-environment smoke test is wanted, that is separate, larger work
# (standing up a per-PR preview deploy), not this job.
#
# WINDOWS / HEADED NOTE:
# The headed layer (Layer 5, Windows MCP / computer-use) and adversarial generation
# (--adversarial) are LOCAL deep-verify steps -- they require a real Windows desktop
# with Chrome and the computer-use MCP running. They cannot run in CI. CI covers
# layers 1-4 and curated edge cases only. The human-gated local run covers layers 5-6.
# Default to ubuntu-latest for network and headless layers.

name: Paradigm Verify

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

jobs:
  quick-verify:
    name: Quick Verify (all PRs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@paradigm-codes'

      # NODE_AUTH_TOKEN is read by the .npmrc actions/setup-node just wrote
      # to the user config (registry-url + scope above); npm interpolates it
      # itself. The token is never echoed, never written by a step of ours,
      # and never appears on a command line.
      - name: Install dependencies (npm ci)
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

      - name: Check ledger
        run: npm run ledger:check

      - name: Check docs/demos/lumen/decisions.md for duplicate decision ids
        run: node scripts/check-decisions.mjs docs/demos/lumen/decisions.md

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck mcp/
        run: npm run mcp:typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Test the deep-verify gate (offline)
        run: bash verify/ci/test_deep_gate.sh

  live-smoke:
    name: Live smoke (deployed site)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yq
        run: |
          YQ_VERSION="v4.44.3"
          YQ_BINARY="yq_linux_amd64"
          YQ_URL="https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/${YQ_BINARY}"

          # Download yq binary
          sudo wget -qO /usr/local/bin/yq "$YQ_URL"

          # Verify SHA256 against the known hash for yq v4.44.3 yq_linux_amd64.
          # yq's "checksums" file is not sha256sum(1) format (one line per
          # file with 30+ hash columns), so sha256sum -c against it always
          # fails to find a properly formatted line. Hard-code the expected
          # hash instead.
          YQ_SHA256="a2c097180dd884a8d50c956ee16a9cec070f30a7947cf4ebf87d5f36213e9ed7"
          echo "${YQ_SHA256}  /usr/local/bin/yq" | sha256sum -c -

          sudo chmod +x /usr/local/bin/yq

      # This hits verify/smoke.yml's deploy_url -- the LIVE deployed site,
      # not this PR's code. It cannot fail because of anything in this PR.
      - name: Run smoke against verify/smoke.yml (production, not this PR)
        run: bash verify/ci/quick_smoke.sh verify/smoke.yml

  deep-verify:
    name: Deep Verify (tier-3 PRs only)
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'tier-3')
    needs: quick-verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The report must name THIS PR (pr<N> in the file name) and record the
      # commit it tested (Tested-SHA), and nothing but reports may have changed
      # since that commit. A PASS report from another PR no longer counts.
      - name: Require a committed deep-verify report for this PR and this code
        run: >-
          bash verify/ci/deep_gate.sh
          "${{ github.event.pull_request.number }}"
          "${{ github.event.pull_request.head.sha }}"
